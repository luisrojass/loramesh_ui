[platformio]
default_envs = esp32-c3-demo-ui

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LORAMESH_UI_SDA_PIN=8
    -D LORAMESH_UI_SCL_PIN=9
    -D LORAMESH_UI_BTN_PIN=7
lib_deps =
    olikraus/U8g2 @ ^2.35.19

; 1. Entorno de Producción (Compila src/main.cpp)
[env:esp32-c3-prod]
build_src_filter = +<*>

; 2. Entorno de Demostración UI (Compila lib/LoRaMeshUI/examples/01_FiveViewsCarouselDemo)
[env:esp32-c3-demo-ui]
build_src_filter = -<*> +<../lib/LoRaMeshUI/examples/01_FiveViewsCarouselDemo/*>
